# TAG AI Platform - Backend Testing (Alternate Ports)
# Uses ports 5433, 6380, and 8001 to avoid conflicts
version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: tag-postgres
    environment:
      POSTGRES_DB: tag_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"  # Changed: host port 5433 instead of 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tag-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: tag-redis
    ports:
      - "6380:6379"  # Changed: host port 6380 instead of 6379
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - tag-network

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tag-backend
    ports:
      - "8001:8000"  # Changed: host port 8001 instead of 8000
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/tag_ai
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - ./ai_models:/app/ai_models
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - tag-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  tag-network:
    driver: bridge
